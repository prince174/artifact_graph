name: artefact-graph
services:
  graph:
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080"]
    restart: unless-stopped
    environment:
      APP_MODE: ${APP_MODE:-demo}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://graph:graph@postgres:5432/graph}
      REFRESH_MINUTES: ${REFRESH_MINUTES:-60}
      SCAN_HISTORY_LIMIT: ${SCAN_HISTORY_LIMIT:-100}
      INCREMENTAL_CACHE_SIZE: ${INCREMENTAL_CACHE_SIZE:-2000}
      PERSISTENT_CACHE_TTL_HOURS: ${PERSISTENT_CACHE_TTL_HOURS:-168}
      PERSISTENT_CACHE_MAX_ROWS: ${PERSISTENT_CACHE_MAX_ROWS:-5000}
      SNAPSHOT_HISTORY_LIMIT: ${SNAPSHOT_HISTORY_LIMIT:-50}
      API_RETRY_ATTEMPTS: ${API_RETRY_ATTEMPTS:-4}
      API_RETRY_BACKOFF_SECONDS: ${API_RETRY_BACKOFF_SECONDS:-0.5}
      BITBUCKET_PROVIDER: ${BITBUCKET_PROVIDER:-cloud}
      BITBUCKET_URL: ${BITBUCKET_URL:-http://bitbucket:7990}
      BITBUCKET_WORKSPACE: ${BITBUCKET_WORKSPACE:-}
      BITBUCKET_EMAIL: ${BITBUCKET_EMAIL:-}
      BITBUCKET_AUTH: ${BITBUCKET_AUTH:-api_token}
      BITBUCKET_TOKEN: ${BITBUCKET_TOKEN:-}
      TEAMCITY_URL: ${TEAMCITY_URL:-http://teamcity:8111}
      TEAMCITY_PUBLIC_URL: ${TEAMCITY_PUBLIC_URL:-http://localhost:8111}
      TEAMCITY_TOKEN: ${TEAMCITY_TOKEN:-}
      REGISTRY_ENABLED: ${REGISTRY_ENABLED:-true}
      REGISTRY_PROVIDER: ${REGISTRY_PROVIDER:-docker}
      REGISTRY_URL: ${REGISTRY_URL:-http://registry:5000}
      REGISTRY_PUBLIC_URL: ${REGISTRY_PUBLIC_URL:-http://localhost:5000}
      REGISTRY_USERNAME: ${REGISTRY_USERNAME:-}
      REGISTRY_TOKEN: ${REGISTRY_TOKEN:-}
      VERIFY_TLS: ${VERIFY_TLS:-true}
      WEB_AUTH_ENABLED: ${WEB_AUTH_ENABLED:-true}
      WEB_USERNAME: ${WEB_USERNAME:-root}
      WEB_PASSWORD: ${WEB_PASSWORD:?WEB_PASSWORD must be set in .env}
      WEB_SESSION_HOURS: ${WEB_SESSION_HOURS:-12}
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-false}
      WEB_LOGIN_ATTEMPTS: ${WEB_LOGIN_ATTEMPTS:-5}
      WEB_LOGIN_WINDOW_SECONDS: ${WEB_LOGIN_WINDOW_SECONDS:-300}
      MAPPING_RULES_PATH: ${MAPPING_RULES_PATH:-/app/config/mapping-rules.yaml}
      WEBHOOK_ENABLED: ${WEBHOOK_ENABLED:-false}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WEBHOOK_VERIFY_TLS: ${WEBHOOK_VERIFY_TLS:-true}
      WEBHOOK_ALLOW_HTTP: ${WEBHOOK_ALLOW_HTTP:-false}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-5}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-6}
    volumes:
      - ./config/mapping-rules.yaml:/app/config/mapping-rules.yaml:ro
    ports:
      - "${GRAPH_BIND:-127.0.0.1}:${GRAPH_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: graph
      POSTGRES_USER: graph
      POSTGRES_PASSWORD: graph
    volumes:
      - graph-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graph"]
      interval: 5s
      timeout: 3s
      retries: 20

  bitbucket-db:
    profiles: ["datacenter"]
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bitbucket
      POSTGRES_USER: bitbucket
      POSTGRES_PASSWORD: bitbucket
    volumes:
      - bitbucket-db:/var/lib/postgresql/data

  bitbucket:
    profiles: ["datacenter"]
    image: atlassian/bitbucket-server:7.10.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:7990:7990"
      - "127.0.0.1:7999:7999"
    environment:
      JDBC_DRIVER: org.postgresql.Driver
      JDBC_URL: jdbc:postgresql://bitbucket-db:5432/bitbucket
      JDBC_USER: bitbucket
      JDBC_PASSWORD: bitbucket
      SERVER_PROXY_NAME: localhost
      SERVER_PROXY_PORT: 7990
      SERVER_SCHEME: http
    volumes:
      - bitbucket-home:/var/atlassian/application-data/bitbucket
    depends_on:
      - bitbucket-db

  teamcity:
    image: jetbrains/teamcity-server:2025.03.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEAMCITY_PORT:-8111}:8111"
    volumes:
      - teamcity-data:/data/teamcity_server/datadir
      - teamcity-logs:/opt/teamcity/logs

  teamcity-agent:
    profiles: [build-lab]
    image: jetbrains/teamcity-agent:2025.03.3-linux-sudo
    privileged: true
    restart: unless-stopped
    environment:
      SERVER_URL: http://teamcity:8111
      DOCKER_IN_DOCKER: start
    volumes:
      - teamcity-agent:/data/teamcity_agent/conf
      - ./config/teamcity-agent/daemon.json:/etc/docker/daemon.json:ro
    depends_on:
      - teamcity

  registry:
    image: registry:2.8.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry-data:/var/lib/registry

volumes:
  graph-db:
  bitbucket-db:
  bitbucket-home:
  teamcity-data:
  teamcity-logs:
  teamcity-agent:
  registry-data:
