# Add after one base Compose file. Certificates are supplied by the operator.
services:
  graph:
    environment:
      WEB_COOKIE_SECURE: "true"
  nginx:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
    volumes:
      - type: bind
        source: ./config/nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HTTPS_CERT_DIR:?Set HTTPS_CERT_DIR with fullchain.pem and privkey.pem}
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      graph:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
