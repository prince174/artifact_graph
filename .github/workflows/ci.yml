name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://
      WEB_PASSWORD: ci-only-password-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[test]'
      - run: pip install pip==26.2.1 pip-audit==2.10.1
      - run: pip-audit --local --progress-spinner off
      - run: pytest -q
      - run: docker compose config --quiet
      - name: Validate isolated production stack (dummy credentials only)
        env:
          POSTGRES_PASSWORD: ci-database-password-only-0000000000000000
          WEB_PASSWORD: ci-web-password-only-11111111111111111111111
          BITBUCKET_TOKEN: ci-read-only-placeholder
          TEAMCITY_TOKEN: ci-read-only-placeholder
        run: docker compose --env-file .env.prod.example -f compose.prod.yaml config --quiet
      - name: Validate external database production stack (dummy credentials only)
        env:
          DATABASE_URL: postgresql+psycopg://reader:dummy@postgres.example/artifact_graph?sslmode=verify-full
          WEB_PASSWORD: ci-web-password-only-11111111111111111111111
          BITBUCKET_TOKEN: ci-read-only-placeholder
          TEAMCITY_TOKEN: ci-read-only-placeholder
        run: docker compose --env-file .env.prod.example -f compose.prod.external-db.yaml config --quiet
      - run: docker build --build-arg GIT_SHA=${{ github.sha }} -t artifact-graph:${{ github.sha }} .
  browser-e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.e2e.yaml config --quiet
      - run: mkdir -p test-results
      - run: docker compose -f compose.e2e.yaml up --build --abort-on-container-exit --exit-code-from browser-e2e
      - if: failure()
        run: |
          docker compose -f compose.e2e.yaml logs --no-color > test-results/compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-results
          path: test-results
          if-no-files-found: ignore
      - if: always()
        run: docker compose -f compose.e2e.yaml down --volumes --remove-orphans
  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned Helm and kind with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz.sha256sum
          sha256sum --check helm-v3.19.0-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v3.19.0-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
          curl -fsSLo kind-linux-amd64 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fsSLO https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          sha256sum --check kind-linux-amd64.sha256sum
          sudo install kind-linux-amd64 /usr/local/bin/kind
      - name: Validate chart and rendered workload contracts
        run: |
          python -m pip install pip==26.2.1 pytest==9.1.1 PyYAML==6.0.2
          helm lint charts/artifact-graph -f charts/artifact-graph/values-local.yaml
          python -m pytest -o addopts='' -q tests/test_helm.py
      - name: Install, upgrade and test pod recovery in kind
        run: python -u scripts/k8s-local.py
      - name: Collect non-secret diagnostics
        if: failure()
        run: |
          mkdir -p test-results/kubernetes
          kubectl --kubeconfig .local-k8s/config -n artifact-graph-test get pods,jobs,events > test-results/kubernetes/status.txt 2>&1 || true
          kubectl --kubeconfig .local-k8s/config -n artifact-graph-test logs deployment/local-graph --tail=100 > test-results/kubernetes/app.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kubernetes-diagnostics
          path: test-results/kubernetes
      - name: Delete isolated CI cluster
        if: always()
        run: kind delete cluster --name artifact-graph-test --kubeconfig .local-k8s/config
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, browser-e2e, kubernetes]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write, id-token: write, attestations: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          build-args: GIT_SHA=${{ github.sha }}
      - uses: actions/attest-build-provenance@v2
        with: {subject-name: 'ghcr.io/${{ github.repository }}', subject-digest: '${{ steps.build.outputs.digest }}', push-to-registry: true}
