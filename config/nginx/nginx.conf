worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Do not log query strings or credentials.
    log_format safe '$remote_addr $request_method $uri $status';
    access_log /dev/stdout safe;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Docker DNS only. For the Podman network use 10.89.0.1 instead;
    # confirm its nameserver in the container's /etc/resolv.conf.
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    server {
        listen 127.0.0.1:8081;
        location = /health { access_log off; return 200 'ok'; }
    }
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        client_max_body_size 8k;
        set $graph_backend graph:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        location = /login {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://$graph_backend;
        }
        location / { proxy_pass http://$graph_backend; }
    }
}
