[project]
name = "artefact-graph"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "httpx==0.28.1",
  "sqlalchemy==2.0.41",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "apscheduler==3.11.0",
  "alembic==1.16.4",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "pytest-asyncio==1.1.0", "pytest-cov==6.2.1"]
e2e = ["pytest==8.4.1", "pytest-playwright==0.7.1", "playwright==1.55.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=75"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["config*", "scripts*", "tests*"]
