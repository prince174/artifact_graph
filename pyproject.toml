[project]
name = "artefact-graph"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "httpx==0.28.1",
  "sqlalchemy==2.0.41",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "apscheduler==3.11.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "pytest-asyncio==1.1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

