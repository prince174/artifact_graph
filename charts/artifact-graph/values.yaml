# Mandatory: choose your registry and immutable image tag (or digest).
image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
# Pre-create Secrets; chart never stores credentials in Helm release values.
existingSecret: ""
migrationSecret: "" # defaults to existingSecret; can contain only DATABASE_URL
caConfigMap: "" # optional existing ConfigMap, files mounted at /app/certs
config:
  WEB_AUTH_PROVIDER: "local"
  LDAP_URL: ""
  LDAP_BIND_DN: ""
  LDAP_USER_BASE_DN: ""
  LDAP_USER_FILTER: "(&(objectClass=user)(sAMAccountName={username}))"
  LDAP_CA_FILE: ""
  LDAP_TIMEOUT_SECONDS: "5"
  LOG_LEVEL: DEBUG
  APP_MODE: live
  DEPLOYMENT_MODE: production
  DATABASE_MODE: external
  BITBUCKET_PROVIDER: datacenter
  BITBUCKET_PROJECT_KEYS: "" # e.g. "CORE,PAY"; empty means all accessible projects
  BITBUCKET_URL: ""
  TEAMCITY_URL: ""
  TEAMCITY_PUBLIC_URL: ""
  TEAMCITY_BUILD_LIMIT: "0"
  TEAMCITY_BUILD_LOOKBACK_DAYS: "90"
  TEAMCITY_INCREMENTAL_HISTORY: "true"
  TEAMCITY_CONCURRENCY: "4"
  BITBUCKET_CONCURRENCY: "4"
  TEAMCITY_BUILD_TYPE_IDS: ""
  TEAMCITY_PROJECT_IDS: ""
  REGISTRY_ENABLED: "false"
  VERIFY_TLS: "true"
  TLS_CA_FILE: ""
  WEB_AUTH_ENABLED: "true"
  WEB_COOKIE_SECURE: "true"
  WEB_USERNAME: root
  WEBHOOK_ENABLED: "false"
mappingRules:
  version: 1
  mappings: []
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi
startupProbe:
  periodSeconds: 10
  failureThreshold: 180
migration:
  activeDeadlineSeconds: 600
ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecretName: ""
  annotations: {}
# Optional: policies must match the actual CNI and destination CIDRs/namespaces.
networkPolicy:
  enabled: false
  ingress: []
  egress: []
